<!DOCTYPE html>
<html>
<head>
  <title>Snake Roguelike: 贪吃蛇：混沌牌局</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #06060f;
    --surface: rgba(255,255,255,0.04);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.1);
    --gold: #ffd93d;
    --gold-dim: #b89a1a;
    --red: #ff4d6a;
    --blue: #4a9eff;
    --green: #3ddc84;
    --purple: #c840ff;
    --text: #e8e8f0;
    --text-dim: #6b6b80;
    --font: 'Outfit', 'Noto Sans SC', 'PingFang SC', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; margin:0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display:flex; align-items:center; justify-content:center; }

  #bg-canvas {
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:0; pointer-events:none;
  }

  #game-container {
    position:relative; z-index:1;
    display:flex; flex-direction:column;
    align-items:center; gap:10px;
  }

  #hud {
    display:flex; justify-content:space-between;
    width:480px; padding:0 2px;
  }
  #hud > div { display:flex; gap:8px; }
  .hud-pill {
    display:flex; align-items:center; gap:6px;
    padding:6px 14px;
    background: var(--glass);
    border:1px solid var(--glass-border);
    border-radius:20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.2s;
  }
  .hud-pill .hud-icon { font-size:14px; }
  .hud-pill .hud-val {
    font-size:15px; font-weight:600;
    font-variant-numeric: tabular-nums;
    min-width:28px; text-align:center;
  }
  .hud-pill.stage .hud-val { color: var(--blue); }
  .hud-pill.timer .hud-val { color: var(--red); }
  .hud-pill.timer.urgent { animation: urgentPulse 0.5s ease-in-out infinite; }
  .hud-pill.length .hud-val { color: var(--green); }
  .hud-pill.score .hud-val { color: var(--gold); }
  @keyframes urgentPulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.08); border-color: var(--red); }
  }

  #timer-bar-wrap {
    width:480px; height:3px;
    background: rgba(255,255,255,0.06);
    border-radius:2px; overflow:hidden;
  }
  #timer-bar {
    height:100%; width:100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius:2px;
    transition: width 0.3s linear;
    transform-origin: left;
  }

  #canvas-wrap {
    position:relative;
    border-radius:12px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 8px 40px rgba(0,0,0,0.6),
      0 0 80px rgba(74,158,255,0.05);
  }
  canvas#game {
    display:block;
    background: #0d0d1a;
  }
  #canvas-wrap.shake {
    animation: shake 0.3s ease-out;
  }
  @keyframes shake {
    0%,100% { transform:translate(0,0); }
    20% { transform:translate(-3px,2px); }
    40% { transform:translate(3px,-2px); }
    60% { transform:translate(-2px,3px); }
    80% { transform:translate(2px,-1px); }
  }

  #cards-bar {
    display:flex; gap:6px; min-height:32px;
    align-items:center; justify-content:center; flex-wrap:wrap;
    max-width:480px;
  }
  .mini-card {
    padding:3px 10px; border-radius:12px; font-size:10px;
    font-weight:600; letter-spacing:0.3px;
    border:1px solid rgba(255,255,255,0.1);
    background: var(--glass);
    backdrop-filter: blur(6px);
    white-space:nowrap;
    animation: cardIn 0.3s ease-out;
  }
  .mini-card.common { border-color:rgba(200,200,200,0.3); color:#bbb; }
  .mini-card.rare { border-color:rgba(74,158,255,0.4); color:var(--blue); background:rgba(74,158,255,0.08); }
  .mini-card.epic { border-color:rgba(200,64,255,0.4); color:var(--purple); background:rgba(200,64,255,0.08); }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(8px) scale(0.9); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  #overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(6,6,15,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index:10;
    transition: opacity 0.3s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }

  .screen { text-align:center; animation: screenIn 0.4s ease-out; }
  @keyframes screenIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }

  .title-logo {
    font-size:42px; font-weight:800;
    background: linear-gradient(135deg, var(--gold) 0%, var(--red) 50%, var(--purple) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:4px;
    text-shadow: none;
    animation: titleGlow 3s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(255,217,61,0.2));
  }
  @keyframes titleGlow {
    from { filter: drop-shadow(0 0 20px rgba(255,217,61,0.15)); }
    to { filter: drop-shadow(0 0 30px rgba(255,217,61,0.35)); }
  }
  .title-sub {
    font-size:13px; font-weight:300;
    color: var(--text-dim); letter-spacing:3px;
    text-transform:uppercase; margin-bottom:36px;
  }

  .btn-main {
    padding:14px 56px; font-size:16px; font-weight:600;
    font-family: var(--font);
    background: linear-gradient(135deg, var(--gold), #ff9a3d);
    border:none; border-radius:12px;
    color:#1a1a2e; cursor:pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(255,217,61,0.25);
    letter-spacing:0.5px;
  }
  .btn-main:hover {
    transform:translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,217,61,0.35);
  }
  .btn-main:active { transform:translateY(0); }

  .btn-secondary {
    padding:10px 40px; font-size:14px; font-weight:600;
    font-family: var(--font);
    background: transparent;
    border:1px solid var(--glass-border);
    border-radius:10px; color:var(--text);
    cursor:pointer; transition: all 0.25s;
  }
  .btn-secondary:hover {
    border-color:var(--gold); color:var(--gold);
    background:rgba(255,217,61,0.05);
  }

  .btn-danger {
    padding:12px 48px; font-size:15px; font-weight:600;
    font-family: var(--font);
    background: linear-gradient(135deg, #ff4444, #ff6b6b);
    border:none; border-radius:12px;
    color:#fff; cursor:pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(255,68,68,0.25);
  }
  .btn-danger:hover {
    transform:translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,68,68,0.35);
  }

  .controls-info {
    margin-top:28px; font-size:11px; color:var(--text-dim);
    line-height:1.8;
  }
  .controls-info kbd {
    display:inline-block; padding:2px 7px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:4px; font-size:10px;
    font-family:var(--font); color:var(--text);
    margin:0 2px;
  }
  .best-score {
    margin-top:16px; padding:8px 20px;
    background:rgba(255,217,61,0.06);
    border:1px solid rgba(255,217,61,0.15);
    border-radius:8px;
    font-size:12px; color:var(--gold);
    display:inline-block;
  }

  .card-select-wrap { width:100%; max-width:540px; }
  .card-select-wrap h2 {
    font-size:18px; font-weight:600;
    color:var(--gold); margin-bottom:2px;
  }
  .card-select-sub {
    font-size:11px; color:var(--text-dim);
    margin-bottom:20px;
  }
  .card-row {
    display:flex; gap:14px;
    justify-content:center; flex-wrap:wrap;
  }
  .card-opt {
    width:155px; padding:20px 14px 16px;
    border-radius:14px; cursor:pointer;
    text-align:center; position:relative;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    animation: cardFlipIn 0.5s ease-out backwards;
    overflow:hidden;
  }
  .card-opt:nth-child(1) { animation-delay:0.05s; }
  .card-opt:nth-child(2) { animation-delay:0.15s; }
  .card-opt:nth-child(3) { animation-delay:0.25s; }
  @keyframes cardFlipIn {
    from { opacity:0; transform:perspective(600px) rotateY(40deg) translateY(20px) scale(0.9); }
    to { opacity:1; transform:perspective(600px) rotateY(0) translateY(0) scale(1); }
  }
  .card-opt:hover { transform:translateY(-6px) scale(1.03); }
  .card-opt::before {
    content:''; position:absolute;
    top:-50%; left:-50%; width:200%; height:200%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.03) 25%, transparent 50%);
    animation: cardShine 6s linear infinite;
    pointer-events:none;
  }
  @keyframes cardShine {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .card-opt.common {
    background: linear-gradient(160deg, rgba(40,40,60,0.9), rgba(25,25,40,0.95));
    border:1px solid rgba(200,200,200,0.15);
  }
  .card-opt.common:hover {
    border-color:rgba(200,200,200,0.35);
    box-shadow:0 8px 30px rgba(150,150,150,0.12);
  }
  .card-opt.rare {
    background: linear-gradient(160deg, rgba(30,40,70,0.9), rgba(20,30,55,0.95));
    border:1px solid rgba(74,158,255,0.3);
  }
  .card-opt.rare:hover {
    border-color:rgba(74,158,255,0.6);
    box-shadow:0 8px 30px rgba(74,158,255,0.2);
  }
  .card-opt.epic {
    background: linear-gradient(160deg, rgba(50,25,65,0.9), rgba(35,15,50,0.95));
    border:1px solid rgba(200,64,255,0.35);
  }
  .card-opt.epic:hover {
    border-color:rgba(200,64,255,0.7);
    box-shadow:0 8px 30px rgba(200,64,255,0.25);
  }
  .card-opt.epic::after {
    content:''; position:absolute; inset:0;
    border-radius:14px;
    background: linear-gradient(135deg, rgba(200,64,255,0.08), transparent 50%, rgba(255,217,61,0.05));
    pointer-events:none;
    animation: epicShimmer 2s ease-in-out infinite alternate;
  }
  @keyframes epicShimmer {
    from { opacity:0.5; }
    to { opacity:1; }
  }

  .card-rarity {
    font-size:9px; font-weight:600;
    text-transform:uppercase; letter-spacing:2.5px;
    margin-bottom:10px;
  }
  .card-opt.common .card-rarity { color:rgba(200,200,200,0.5); }
  .card-opt.rare .card-rarity { color:var(--blue); }
  .card-opt.epic .card-rarity { color:var(--purple); }
  .card-icon-big { font-size:32px; margin-bottom:10px; line-height:1; }
  .card-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:6px; }
  .card-desc-text { font-size:11px; color:rgba(255,255,255,0.5); line-height:1.5; }

  .reroll-wrap { margin-top:18px; }
  .reroll-btn {
    padding:8px 24px; font-size:12px; font-weight:500;
    font-family:var(--font);
    background:transparent;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px; color:var(--text-dim);
    cursor:pointer; transition:all 0.25s;
  }
  .reroll-btn:hover:not(:disabled) {
    border-color:var(--gold); color:var(--gold);
    background:rgba(255,217,61,0.04);
  }
  .reroll-btn:disabled { opacity:0.25; cursor:default; }

  .summary-wrap { text-align:center; }
  .summary-badge {
    display:inline-block; padding:4px 16px;
    background:rgba(61,220,132,0.1);
    border:1px solid rgba(61,220,132,0.25);
    border-radius:20px;
    font-size:11px; font-weight:600; color:var(--green);
    letter-spacing:1px; text-transform:uppercase;
    margin-bottom:12px;
  }
  .summary-title {
    font-size:22px; font-weight:800; color:#fff;
    margin-bottom:16px;
  }
  .summary-score-box {
    display:inline-block; padding:16px 40px;
    background:rgba(255,217,61,0.06);
    border:1px solid rgba(255,217,61,0.15);
    border-radius:16px; margin-bottom:16px;
  }
  .summary-score-num {
    font-size:36px; font-weight:800; color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .summary-score-label {
    font-size:10px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:2px;
    margin-top:2px;
  }
  .summary-stats {
    display:flex; gap:24px; justify-content:center;
    margin-bottom:24px;
  }
  .summary-stat { text-align:center; }
  .summary-stat-val { font-size:18px; font-weight:600; color:#fff; }
  .summary-stat-label { font-size:10px; color:var(--text-dim); margin-top:2px; }

  .boss-wrap { text-align:center; }
  .boss-badge {
    display:inline-block; padding:6px 20px;
    background:rgba(255,68,68,0.1);
    border:1px solid rgba(255,68,68,0.3);
    border-radius:20px;
    font-size:11px; font-weight:600; color:var(--red);
    letter-spacing:2px; text-transform:uppercase;
    margin-bottom:16px;
    animation: bossPulse 1.5s ease-in-out infinite;
  }
  @keyframes bossPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(255,68,68,0.2); }
    50% { box-shadow:0 0 20px 4px rgba(255,68,68,0.15); }
  }
  .boss-name {
    font-size:28px; font-weight:800; color:#fff;
    margin-bottom:8px;
  }
  .boss-desc-text {
    font-size:13px; color:var(--text-dim);
    margin-bottom:28px; max-width:300px;
    margin-left:auto; margin-right:auto;
    line-height:1.6;
  }

  .over-wrap { text-align:center; }
  .over-title {
    font-size:14px; font-weight:600;
    color:var(--text-dim); letter-spacing:3px;
    text-transform:uppercase; margin-bottom:8px;
  }
  .over-score {
    font-size:48px; font-weight:800; color:var(--gold);
    font-variant-numeric:tabular-nums;
    margin-bottom:4px;
    filter: drop-shadow(0 0 20px rgba(255,217,61,0.2));
  }
  .over-best {
    font-size:11px; color:var(--text-dim);
    margin-bottom:24px;
  }
  .over-stats {
    display:flex; gap:20px; justify-content:center;
    margin-bottom:28px;
  }
  .over-stat {
    padding:12px 20px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:12px;
    min-width:90px;
  }
  .over-stat-val { font-size:20px; font-weight:700; color:#fff; }
  .over-stat-label { font-size:10px; color:var(--text-dim); margin-top:4px; }

  .score-popup {
    position:absolute; pointer-events:none; z-index:5;
    font-size:14px; font-weight:700; color:var(--gold);
    font-family:var(--font);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 8px rgba(255,217,61,0.4);
    animation: popFloat 0.9s ease-out forwards;
  }
  @keyframes popFloat {
    0% { opacity:1; transform:translateY(0) scale(1); }
    30% { transform:translateY(-10px) scale(1.15); }
    100% { opacity:0; transform:translateY(-35px) scale(0.9); }
  }
  .score-popup.big {
    font-size:18px;
    color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.4);
  }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="game-container">
  <div id="hud">
    <div>
      <div class="hud-pill stage"><span class="hud-icon">📍</span><span class="hud-val" id="hud-stage">1</span></div>
      <div class="hud-pill timer" id="timer-pill"><span class="hud-icon">⏱</span><span class="hud-val" id="hud-timer">30</span></div>
    </div>
    <div>
      <div class="hud-pill length"><span class="hud-icon">🐍</span><span class="hud-val" id="hud-length">3</span></div>
      <div class="hud-pill score"><span class="hud-icon">⭐</span><span class="hud-val" id="hud-score">0</span></div>
    </div>
  </div>
  <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
  <div id="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="cards-bar"></div>
</div>

<script>
(function(){
'use strict';

var bgCanvas = document.getElementById('bg-canvas');
var bgCtx = bgCanvas.getContext('2d');
function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

var bgParticles = [];
for (var i = 0; i < 60; i++) {
  bgParticles.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.3,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    a: Math.random() * 0.3 + 0.1
  });
}
function drawBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (var i = 0; i < bgParticles.length; i++) {
    var p = bgParticles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = bgCanvas.width;
    if (p.x > bgCanvas.width) p.x = 0;
    if (p.y < 0) p.y = bgCanvas.height;
    if (p.y > bgCanvas.height) p.y = 0;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = 'rgba(150,160,200,' + p.a + ')';
    bgCtx.fill();
  }
  for (var i = 0; i < bgParticles.length; i++) {
    for (var j = i + 1; j < bgParticles.length; j++) {
      var dx = bgParticles[i].x - bgParticles[j].x;
      var dy = bgParticles[i].y - bgParticles[j].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 120) {
        bgCtx.beginPath();
        bgCtx.moveTo(bgParticles[i].x, bgParticles[i].y);
        bgCtx.lineTo(bgParticles[j].x, bgParticles[j].y);
        bgCtx.strokeStyle = 'rgba(100,110,150,' + (0.06 * (1 - d / 120)) + ')';
        bgCtx.lineWidth = 0.5;
        bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
drawBg();

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var overlay = document.getElementById('overlay');
var hudStage = document.getElementById('hud-stage');
var hudTimer = document.getElementById('hud-timer');
var hudLength = document.getElementById('hud-length');
var hudScore = document.getElementById('hud-score');
var timerBar = document.getElementById('timer-bar');
var timerPill = document.getElementById('timer-pill');
var cardsBar = document.getElementById('cards-bar');
var canvasWrap = document.getElementById('canvas-wrap');

var GRID = 16;
var COLS = 30;
var ROWS = 30;
var W = COLS * GRID;
var H = ROWS * GRID;
canvas.width = W;
canvas.height = H;

var COLORS = ['red','blue','green','gold'];
var COLOR_HEX = {red:'#ff4d6a', blue:'#4a9eff', green:'#3ddc84', gold:'#ffd93d'};
var COLOR_GLOW = {red:'rgba(255,77,106,', blue:'rgba(74,158,255,', green:'rgba(61,220,132,', gold:'rgba(255,217,61,'};
var COLOR_EMOJI = {red:'🔴', blue:'🔵', green:'🟢', gold:'🟡'};
var COLOR_CN = {red:'红色', blue:'蓝色', green:'绿色', gold:'金色'};

var ST_TITLE=0, ST_PLAY=1, ST_CARDS=2, ST_BOSS=3, ST_SUMMARY=4, ST_OVER=5;
var state = ST_TITLE;

var meta = loadMeta();
function loadMeta() {
  try { return JSON.parse(localStorage.getItem('snakeRoguelike')||'{}'); }
  catch(e) { return {}; }
}
function mget(k,d) { return meta[k]!==undefined ? meta[k] : d; }
function mset(k,v) { meta[k]=v; localStorage.setItem('snakeRoguelike',JSON.stringify(meta)); }

var snake, balls, stage, stageTimer, stageMaxTimer, stageScore, totalScore, cards;
var bossActive, bossType, bossTimer;
var shieldUsed, focusStreak, focusColor;
var stageBallsEaten, rerollsLeft;
var darkMode, shrinkBorder, meteorZones, ballHungerTimers;
var speedMult, speedTimerAcc;
var tickAcc, timerAcc;
var particles = [];
var trailParticles = [];
var displayScore = 0;

function getMaxSlots() {
  var s = mget('extraSlot',false) ? 3 : 2;
  s += Math.floor(stage/3);
  return Math.min(s,5);
}
function getMaxBalls() {
  var n=3;
  for(var i=0;i<cards.length;i++) {
    if(cards[i].id==='ball_plus') n+=cards[i].vals.ballPlus;
  }
  return n;
}
function getColorProb(color) {
  var probs={red:0.25,blue:0.25,green:0.25,gold:0.25};
  for(var i=0;i<cards.length;i++) {
    if(cards[i].type==='A') probs[cards[i].color]+=cards[i].vals.probBoost;
  }
  var t=probs.red+probs.blue+probs.green+probs.gold;
  if(t<=0) return 0.25;
  return probs[color]/t;
}
function pickColor() {
  var r=Math.random(),cum=0;
  for(var i=0;i<COLORS.length;i++) {
    cum+=getColorProb(COLORS[i]);
    if(r<cum) return COLORS[i];
  }
  return COLORS[3];
}
function isOccupied(x,y) {
  for(var i=0;i<snake.cells.length;i++) {
    if(snake.cells[i].x===x&&snake.cells[i].y===y) return true;
  }
  for(var i=0;i<balls.length;i++) {
    if(balls[i].x===x&&balls[i].y===y) return true;
  }
  var b=shrinkBorder*GRID;
  if(x<b||x>=W-b||y<b||y>=H-b) return true;
  return false;
}
function spawnBall() {
  var x,y,att=0;
  var minG=shrinkBorder,maxGx=COLS-shrinkBorder,maxGy=ROWS-shrinkBorder;
  if(maxGx<=minG||maxGy<=minG) return;
  do {
    x=(minG+Math.floor(Math.random()*(maxGx-minG)))*GRID;
    y=(minG+Math.floor(Math.random()*(maxGy-minG)))*GRID;
    att++;
  } while(isOccupied(x,y)&&att<200);
  balls.push({x:x,y:y,big:Math.random()<0.25,color:pickColor(),id:Date.now()+Math.random(),spawnT:Date.now()});
}
function ensureBalls() {
  var max=getMaxBalls();
  while(balls.length<max) spawnBall();
}
function resetSnake() {
  var cx=Math.floor(COLS/2)*GRID, cy=Math.floor(ROWS/2)*GRID;
  var oldMax = snake ? snake.maxCells : 3;
  snake={x:cx,y:cy,dx:GRID,dy:0,ndx:GRID,ndy:0,cells:[],maxCells:oldMax};
  for(var i=0;i<snake.maxCells;i++) snake.cells.push({x:cx-i*GRID,y:cy});
}

function startStage() {

function restartStage() {

  doShake();
}
function doShake() {
  canvasWrap.classList.remove('shake');
  void canvasWrap.offsetWidth;
  canvasWrap.classList.add('shake');
}
function calcScore(ball) {
  var sLen=snake.cells.length;
  var base=10,bonus=0,mult=1.0,fMult=1.0;
  for(var i=0;i<cards.length;i++) {
    var c=cards[i];
    if(c.type==='B'&&c.color===ball.color) bonus+=c.vals.colorBonus;
    if(c.type==='C'&&c.color===ball.color) mult*=c.vals.colorMult;
    if(c.type==='D') {
      if(c.color===ball.color) { base=0; bonus=0; }
      var tgt={red:'gold',blue:'red',green:'blue',gold:'green'}[c.color];
      if(tgt===ball.color) mult*=c.vals.sacrificeMult;
    }
  }
  if(focusColor!==null) {
    var pb=0;
    for(var i=0;i<cards.length;i++) {
      if(cards[i].type==='E'&&cards[i].color===focusColor) pb+=cards[i].vals.focusPerBall;
    }
    if(pb>0) fMult=1.0+focusStreak*pb;
  }
  var bigMult=1.0;
  if(ball.big) {
    for(var i=0;i<cards.length;i++) {
      if(cards[i].id==='big_ball') bigMult*=cards[i].vals.bigBallMult;
    }
  }
  return Math.round(sLen*Math.max(0,base+bonus)*mult*fMult*bigMult);
}
function spawnEatParticles(x,y,color,count) {
  for(var i=0;i<count;i++) {
    var angle=Math.random()*Math.PI*2;
    var speed=Math.random()*3+1;
    particles.push({
      x:x+GRID/2, y:y+GRID/2,
      vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      life:1, decay:0.02+Math.random()*0.02,
      r:Math.random()*3+1, color:COLOR_HEX[color]
    });
  }
}
function showPopup(x,y,score,big) {
  var el=document.createElement('div');
  el.className='score-popup'+(big?' big':'');
  el.textContent='+'+score;

  canvasWrap.appendChild(el);
  setTimeout(function(){el.remove();},900);
}
function eatBall(ball) {
  var score=calcScore(ball);
  stageScore+=score; totalScore+=score; stageBallsEaten++;
  if(ball.big) snake.maxCells++;
  if(focusColor===null||focusColor===ball.color) {
    if(focusColor===null) focusColor=ball.color;
    focusStreak++;
  } else { focusColor=ball.color; focusStreak=1; }
  spawnEatParticles(ball.x,ball.y,ball.color,ball.big?16:8);
  showPopup(ball.x,ball.y,score,ball.big);
  var idx=balls.indexOf(ball);
  if(idx>=0) balls.splice(idx,1);
  ensureBalls();
  var ml=mget('maxSnakeLen',0);
  if(snake.cells.length>ml) {
    mset('maxSnakeLen',snake.cells.length);
    if(snake.cells.length>30) mset('unlockedEpicBigBall',true);
  }
}
function selfCollision() {
  var hasShield=false, shrinkAmt=3;
  for(var i=0;i<cards.length;i++) {
    if(cards[i].id==='shield') {
      hasShield=true;
      shrinkAmt=Math.min(shrinkAmt,cards[i].vals.shieldShrink);
    }
  }
  if(hasShield&&!shieldUsed) {
    shieldUsed=true;
    snake.maxCells=Math.max(3,snake.maxCells-shrinkAmt);
    while(snake.cells.length>snake.maxCells) snake.cells.pop();
    doShake();
    return;
  }
  restartStage();
}
function endStage() {
  var bs=mget('bestStageScore',0);

  if(stage>=3) mset('clearedStage3',true);
  if(mget('clearedStage3',false)) mset('unlockedSacrifice',true);
  if(bossActive&&bossType===0) mset('beatBoss1',true);

  if(stageScore>2000) mset('unlockedBallPlus',true);

  state=ST_SUMMARY;

}

function rollCard() {
  var defs=getAllCardDefs();
  var def=defs[Math.floor(Math.random()*defs.length)];
  var r=Math.random();

  var rNames=['普通','稀有','史诗'];
  var rClasses=['common','rare','epic'];
  var vals={};
  for(var k in def.valKeys) vals[k]=def.valKeys[k][rarity];
  return {
    id:def.id,type:def.type,color:def.color,
    name:def.name,icon:def.icon,
    desc:def.descFn.call(def,vals),
    vals:vals,
    rarity:rarity,rarityName:rNames[rarity],rarityClass:rClasses[rarity]
  };
}

function updateBoss(dt) {
  if(!bossActive) return;
  bossTimer+=dt;
  if(bossType===0) {
    var expected=Math.floor(bossTimer/10);
    if(expected>shrinkBorder&&shrinkBorder<Math.floor(COLS/2)-2) {
      shrinkBorder=expected;
      var b=shrinkBorder*GRID;
      balls=balls.filter(function(bl){return bl.x>=b&&bl.x<W-b&&bl.y>=b&&bl.y<H-b;});
      ensureBalls();
    }
  }
  if(bossType===1) {
    var last=meteorZones._lastSpawn||0;
    if(bossTimer-last>3) {
      meteorZones._lastSpawn=bossTimer;
      var mx=(shrinkBorder+Math.floor(Math.random()*(COLS-2*shrinkBorder-3)))*GRID;
      var my=(shrinkBorder+Math.floor(Math.random()*(ROWS-2*shrinkBorder-3)))*GRID;
      meteorZones.push({x:mx,y:my,timer:1.5,warned:true,hit:false,hitTimer:0});
    }
    for(var i=meteorZones.length-1;i>=0;i--) {
      var m=meteorZones[i];
      m.timer-=dt;
      if(m.timer<=0&&m.warned) {
        m.warned=false; m.hit=true; m.hitTimer=0.4;
        doShake();
        if(snake.x>=m.x&&snake.x<m.x+3*GRID&&snake.y>=m.y&&snake.y<m.y+3*GRID) {
          snake.maxCells=Math.max(3,snake.maxCells-2);
          while(snake.cells.length>snake.maxCells) snake.cells.pop();
        }
      }
      if(m.hit) { m.hitTimer-=dt; if(m.hitTimer<=0) meteorZones.splice(i,1); }
    }
  }
  if(bossType===2) {
    speedTimerAcc+=dt;
    if(speedTimerAcc>=8&&speedMult<1.6) { speedTimerAcc-=8; speedMult+=0.1; }
  }
  if(bossType===4) {
    for(var i=0;i<balls.length;i++) {
      var bl=balls[i];
      if(!ballHungerTimers[bl.id]) ballHungerTimers[bl.id]=bossTimer;
      if(bossTimer-ballHungerTimers[bl.id]>8) {
        ballHungerTimers[bl.id]=bossTimer;
        var nx,ny,att=0;
        var minG=shrinkBorder,maxG=COLS-shrinkBorder;
        do {
          nx=(minG+Math.floor(Math.random()*(maxG-minG)))*GRID;
          ny=(minG+Math.floor(Math.random()*(maxG-minG)))*GRID;
          att++;
        } while(isOccupied(nx,ny)&&att<50);
        bl.x=nx; bl.y=ny;
      }
    }
  }
}
function gameTick() {
  snake.dx=snake.ndx; snake.dy=snake.ndy;
  snake.x+=snake.dx; snake.y+=snake.dy;
  if(!bossActive||bossType!==0) {
    if(snake.x<0) snake.x=W-GRID;
    else if(snake.x>=W) snake.x=0;
    if(snake.y<0) snake.y=H-GRID;
    else if(snake.y>=H) snake.y=0;
  } else {
    var b=shrinkBorder*GRID;
    if(snake.x<b||snake.x>=W-b||snake.y<b||snake.y>=H-b) { selfCollision(); return; }
  }
  if(trailParticles.length<200&&snake.cells.length>0) {
    var tail=snake.cells[snake.cells.length-1];
    trailParticles.push({
      x:tail.x+GRID/2+Math.random()*4-2,
      y:tail.y+GRID/2+Math.random()*4-2,
      life:1, decay:0.04+Math.random()*0.02,
      r:Math.random()*2+0.5
    });
  }
  snake.cells.unshift({x:snake.x,y:snake.y});
  if(snake.cells.length>snake.maxCells) snake.cells.pop();
  for(var i=balls.length-1;i>=0;i--) {
    if(snake.x===balls[i].x&&snake.y===balls[i].y) eatBall(balls[i]);
  }
  for(var idx=1;idx<snake.cells.length;idx++) {
    if(snake.cells[0].x===snake.cells[idx].x&&snake.cells[0].y===snake.cells[idx].y) {
      selfCollision(); return;
    }
  }
}
function updateHUD() {
  hudStage.textContent=stage;
  var t=Math.ceil(stageTimer);
  hudTimer.textContent=t;
  hudLength.textContent=snake?snake.cells.length:3;
  if(displayScore<totalScore) {
    displayScore+=Math.max(1,Math.ceil((totalScore-displayScore)*0.15));
    if(displayScore>totalScore) displayScore=totalScore;
  }
  hudScore.textContent=displayScore;
  var pct=stageMaxTimer>0?(stageTimer/stageMaxTimer):1;
  timerBar.style.width=(pct*100)+'%';
  if(t<=5) { timerPill.classList.add('urgent'); }
  else { timerPill.classList.remove('urgent'); }
}
function render() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d0d1a';
  ctx.fillRect(0,0,W,H);

  if(state===ST_TITLE||state===ST_OVER) return;
  if(!snake||!snake.cells||snake.cells.length===0) return;

  ctx.strokeStyle='rgba(255,255,255,0.02)';
  ctx.lineWidth=0.5;
  for(var x=0;x<=W;x+=GRID) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(var y=0;y<=H;y+=GRID) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  if(shrinkBorder>0) {
    var b=shrinkBorder*GRID;
    ctx.fillStyle='rgba(255,30,30,0.04)';
    ctx.fillRect(0,0,W,b); ctx.fillRect(0,H-b,W,b);
    ctx.fillRect(0,0,b,H); ctx.fillRect(W-b,0,b,H);
    ctx.save();
    ctx.shadowColor='rgba(255,68,68,0.4)';
    ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(255,68,68,0.6)';
    ctx.lineWidth=2;
    ctx.strokeRect(b,b,W-2*b,H-2*b);
    ctx.restore();
  }

  for(var i=0;i<meteorZones.length;i++) {
    var m=meteorZones[i];
    if(m.warned&&m.timer>0) {
      var pulse=0.15+0.2*Math.abs(Math.sin(Date.now()/80));
      ctx.fillStyle='rgba(255,68,68,'+pulse+')';
      ctx.fillRect(m.x,m.y,3*GRID,3*GRID);
      ctx.save();
      ctx.shadowColor='rgba(255,68,68,0.5)';
      ctx.shadowBlur=10;
      ctx.strokeStyle='rgba(255,68,68,0.6)';
      ctx.lineWidth=1.5;
      ctx.strokeRect(m.x,m.y,3*GRID,3*GRID);
      ctx.restore();
    }
    if(m.hit&&m.hitTimer>0) {
      var a=m.hitTimer/0.4*0.6;
      ctx.fillStyle='rgba(255,120,0,'+a+')';
      ctx.fillRect(m.x-2,m.y-2,3*GRID+4,3*GRID+4);
    }
  }

  var now=Date.now();
  for(var i=0;i<balls.length;i++) {
    var bl=balls[i];
    var r=bl.big?GRID/2:GRID/3;
    var cx=bl.x+GRID/2, cy=bl.y+GRID/2;
    var age=(now-bl.spawnT)/1000;
    var bob=Math.sin(age*3)*1.5;
    cy+=bob;
    ctx.save();
    ctx.shadowColor=COLOR_GLOW[bl.color]+'0.5)';
    ctx.shadowBlur=bl.big?14:8;
    ctx.fillStyle=COLOR_HEX[bl.color];
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    if(bl.big) {
      ctx.strokeStyle='rgba(255,255,255,0.5)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(cx,cy,r+1,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(cx-r*0.25,cy-r*0.3,r*0.25,0,Math.PI*2);
    ctx.fill();
  }

  for(var i=trailParticles.length-1;i>=0;i--) {
    var tp=trailParticles[i];
    tp.life-=tp.decay;
    if(tp.life<=0) { trailParticles.splice(i,1); continue; }
    ctx.fillStyle='rgba(61,220,132,'+(tp.life*0.2)+')';
    ctx.beginPath();
    ctx.arc(tp.x,tp.y,tp.r*tp.life,0,Math.PI*2);
    ctx.fill();
  }

  for(var i=snake.cells.length-1;i>=0;i--) {
    var cell=snake.cells[i];
    var t=i/Math.max(1,snake.cells.length-1);
    if(i===0) {
      ctx.save();
      ctx.shadowColor='rgba(255,255,255,0.4)';
      ctx.shadowBlur=10;
      ctx.fillStyle='#ffffff';
      roundRect(ctx,cell.x+1,cell.y+1,GRID-2,GRID-2,4);
      ctx.fill();
      ctx.restore();
      var eyeOff = snake.dx>0?3:snake.dx<0?-3:0;
      var eyeOffY = snake.dy>0?3:snake.dy<0?-3:0;
      ctx.fillStyle='#333';
      ctx.beginPath();
      ctx.arc(cell.x+GRID/2+eyeOff-2, cell.y+GRID/2+eyeOffY-2, 1.5, 0, Math.PI*2);
      ctx.arc(cell.x+GRID/2+eyeOff+2, cell.y+GRID/2+eyeOffY-2, 1.5, 0, Math.PI*2);
      ctx.fill();
    } else {
      var g=Math.round(220-t*80);
      var b2=Math.round(100-t*40);
      ctx.fillStyle='rgb('+b2+','+g+','+b2+')';
      var shrink = 1 + t * 1.5;
      roundRect(ctx, cell.x+shrink, cell.y+shrink, GRID-shrink*2, GRID-shrink*2, 3);
      ctx.fill();
    }
  }

  for(var i=particles.length-1;i>=0;i--) {
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=0.05;
    p.life-=p.decay;
    if(p.life<=0) { particles.splice(i,1); continue; }
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  if(darkMode&&snake.cells.length>0) {
    var head=snake.cells[0];
    var hcx=head.x+GRID/2, hcy=head.y+GRID/2;
    var vr=5*GRID;
    ctx.save();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,0.93)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='destination-out';
    var grad=ctx.createRadialGradient(hcx,hcy,0,hcx,hcy,vr);
    grad.addColorStop(0,'rgba(0,0,0,1)');
    grad.addColorStop(0.5,'rgba(0,0,0,0.9)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(hcx,hcy,vr,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  if(bossActive&&bossType===2) {
    ctx.fillStyle='rgba(255,136,0,0.8)';
    ctx.font='bold 11px '+getComputedStyle(document.body).fontFamily;
    ctx.fillText('⚡ 速度 ×'+speedMult.toFixed(1),8,H-10);
  }
  var hasShield=false;
  for(var i=0;i<cards.length;i++) { if(cards[i].id==='shield') hasShield=true; }
  if(hasShield&&!shieldUsed) {
    ctx.fillStyle='rgba(74,158,255,0.8)';
    ctx.font='bold 11px '+getComputedStyle(document.body).fontFamily;
    ctx.fillText('🛡️ 护盾就绪',W-90,H-10);
  }
}

function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

var lastTs=0;
tickAcc=0; timerAcc=0;

function loop(ts) {
  requestAnimationFrame(loop);
  if(lastTs===0) { lastTs=ts; return; }
  var dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(dt>0.1) dt=0.1;
  if(state===ST_PLAY) {
    timerAcc+=dt;
    while(timerAcc>=1) {
      timerAcc-=1;
      stageTimer-=1;
      if(stageTimer<=0) {
        stageTimer=0;
        endStage();
        render(); updateHUD();
        return;
      }
    }
    updateBoss(dt);
    var tickRate=(1/15)/speedMult;
    tickAcc+=dt;
    var mx=4;
    while(tickAcc>=tickRate&&mx>0) { tickAcc-=tickRate; gameTick(); mx--; }
    if(tickAcc>tickRate*2) tickAcc=0;
  }
  render();
  updateHUD();
}

document.addEventListener('keydown',function(e){
  if(state!==ST_PLAY) return;
  var k=e.key;
  if((k==='ArrowLeft'||k==='a'||k==='A')&&snake.dx===0) {
    snake.ndx=-GRID; snake.ndy=0; e.preventDefault();
  } else if((k==='ArrowUp'||k==='w'||k==='W')&&snake.dy===0) {
    snake.ndy=-GRID; snake.ndx=0; e.preventDefault();
  } else if((k==='ArrowRight'||k==='d'||k==='D')&&snake.dx===0) {
    snake.ndx=GRID; snake.ndy=0; e.preventDefault();
  } else if((k==='ArrowDown'||k==='s'||k==='S')&&snake.dy===0) {
    snake.ndy=GRID; snake.ndx=0; e.preventDefault();
  }
});

showTitle();
requestAnimationFrame(loop);

})();
</script>
